name: Release

# Ein Release startet auf einem von zwei Wegen:
#
#   Release-Branch:  git push origin HEAD:release/2.0.0-forkai.153
#   Tag:             git tag -a v2.0.0-forkai.153 -m "2.0.0-forkai.153" && git push origin v2.0.0-forkai.153
#
# Der Branch ist der Weg fuer Claude-Sitzungen: GitHub lehnt Tag-Pushes aus
# einer solchen Sitzung mit HTTP 403 ab (30.09.2026, forkai.153), Branches
# gehen. Beim Branch-Weg legt der Workflow den Tag am Ende SELBST an und
# loescht den Branch wieder — die Geschichte sieht aus wie beim Tag-Weg.
#
# Was dann passiert, erzwingt GitHub — nicht die Sorgfalt dessen, der
# released:
#
#   1. CI (ci.yml, alle Pruefungen) und Image-Bau (docker-publish.yml) laufen
#      GLEICHZEITIG. Das Image liegt danach unter seiner Versionsnummer in
#      GHCR, aber Home Assistant bietet es noch niemandem an — das tut es erst,
#      wenn `grow-os/config.yaml` die Nummer traegt.
#   2. Erst wenn BEIDES gruen ist: Manifest ansehen (anonym abrufbar, alle drei
#      Architekturen), dann `config.yaml` hochzaehlen und nach main schieben,
#      dann `latest` setzen.
#
# Ist die CI rot, wird nichts hochgezaehlt und nichts nach main geschoben. Das
# Image unter der Nummer bleibt liegen, wird aber nie angeboten; nach der
# Reparatur ueberschreibt der naechste Lauf es unter derselben Nummer.
#
# Der Changelog-Eintrag steht schon im Release-Commit. Home Assistant zeigt
# ihn erst an, wenn es das Update anbietet — also erst nach Schritt 2.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/*"

permissions:
  contents: read

# Zwei Releases gleichzeitig wuerden beide main vorspulen wollen.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.nummer.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ALLES, was ein Release unmoeglich macht, faellt HIER auf — bevor das
      # Image gebaut wird. Sonst ueberschreibt der Image-Bau im Zweifel ein
      # schon ausgeliefertes Image, und erst der letzte Schritt merkt es.
      - name: Nummer aus Tag oder Release-Branch lesen und pruefen
        id: nummer
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${GITHUB_REF_NAME#release/}"
            V="${V#v}"
          fi
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::'$GITHUB_REF_NAME' traegt keine Version wie 2.0.0-forkai.153."
            exit 1
          fi
          # Beim Branch-Weg legt der Workflow den Tag am Ende selbst an. Gibt
          # es ihn schon, scheitert das — lieber jetzt als nach dem Image-Bau.
          if [ "$GITHUB_REF_TYPE" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "::error::Den Tag v$V gibt es schon. Diese Nummer ist vergeben."
            exit 1
          fi
          # Ohne Eintrag zeigt Home Assistant beim Update den Text der VORIGEN
          # Version an. Das faellt hier auf, nicht erst beim Nutzer.
          if ! grep -qxF "## $V" grow-os/CHANGELOG.md; then
            echo "::error::grow-os/CHANGELOG.md hat keinen Abschnitt '## $V'."
            exit 1
          fi
          # Die veroeffentlichte Nummer steht auf MAIN, nicht im getaggten
          # Commit — der Release-Commit liegt ja ueber dem Tag. Wer einen Tag
          # nach dem Release neu setzt, haette sonst das ausgelieferte Image
          # unter derselben Nummer mit ungeprueftem Code ueberschrieben.
          git fetch origin main
          ALT=$(git show origin/main:grow-os/config.yaml | grep -E '^version:' | sed -E 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/')
          if [ "$ALT" = "$V" ]; then
            echo "::error::main traegt schon $V — diese Nummer ist bereits veroeffentlicht."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main enthaelt Commits, die im Release-Commit fehlen. Erst main in den Branch holen, dann neu starten."
            exit 1
          fi
          # Der GITHUB_TOKEN darf keine Aenderung an .github/workflows nach
          # main schieben — GitHub lehnt das ab, und dieses Recht kann der
          # Token nicht bekommen. Solche Commits muessen VOR dem Taggen von
          # Hand nach main (nach gruener CI am Branch).
          WORKFLOWS=$(git diff --name-only origin/main HEAD -- .github/workflows)
          if [ -n "$WORKFLOWS" ]; then
            echo "::error::Der Release-Commit aendert Workflow-Dateien gegenueber main:"
            printf '%s\n' "$WORKFLOWS"
            echo "::error::Erst main von Hand auf diesen Commit vorspulen (CI am Branch gruen), dann neu starten."
            exit 1
          fi
          echo "Release $V (bisher $ALT)"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  # Hat die CI GENAU diesen Commit schon geprueft (Push auf den Arbeitsbranch),
  # wird nicht noch einmal geprueft. Bis forkai.154 lief jede Pruefung beim
  # Release ein zweites Mal — 5 bis 13 Minuten fuer ein Ergebnis, das schon
  # feststand. Gleichwertig ist das, weil ein CI-Lauf auf einem Push die ci.yml
  # AUS DIESEM COMMIT faehrt: dasselbe Tor, derselbe Stand.
  #
  # Laeuft die CI fuer den Commit noch, wird gewartet statt doppelt gestartet —
  # Arbeitsbranch und Release-Branch duerfen also direkt nacheinander gepusht
  # werden. Kein Lauf, oder keiner gruen: dann prueft release.yml selbst.
  ci-stand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      gruen: ${{ steps.stand.outputs.gruen }}
      lauf: ${{ steps.stand.outputs.lauf }}
    steps:
      - name: CI-Lauf fuer genau diesen Commit suchen
        id: stand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            LAEUFE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20")
            GRUEN=$(jq -r '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push" and .conclusion == "success")][0].id // empty' <<<"$LAEUFE")
            if [ -n "$GRUEN" ]; then
              echo "CI war fuer $GITHUB_SHA schon gruen: Lauf $GRUEN — keine zweite Pruefung."
              echo "gruen=true" >> "$GITHUB_OUTPUT"
              echo "lauf=$GRUEN" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            OFFEN=$(jq -r '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push" and .status != "completed")] | length' <<<"$LAEUFE")
            if [ "$OFFEN" = "0" ]; then
              echo "Kein gruener CI-Lauf fuer $GITHUB_SHA — release.yml prueft selbst."
              echo "gruen=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CI fuer $GITHUB_SHA laeuft noch — warte (Runde $i)."
            sleep 20
          done
          echo "CI fuer $GITHUB_SHA nach 26 Minuten nicht fertig — release.yml prueft selbst."
          echo "gruen=false" >> "$GITHUB_OUTPUT"

  pruefen:
    needs: ci-stand
    if: needs.ci-stand.outputs.gruen != 'true'
    uses: ./.github/workflows/ci.yml

  image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      latest: false

  # Veroeffentlicht wird nur, wenn der Commit nachweislich geprueft ist: von
  # `pruefen` in diesem Lauf, oder — und nur dann ist `pruefen` uebersprungen —
  # von einem gruenen CI-Lauf auf genau diesem Commit.
  veroeffentlichen:
    needs: [version, ci-stand, pruefen, image]
    if: >-
      !cancelled()
      && needs.version.result == 'success'
      && needs.image.result == 'success'
      && needs.ci-stand.result == 'success'
      && (needs.pruefen.result == 'success'
          || (needs.pruefen.result == 'skipped' && needs.ci-stand.outputs.gruen == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      V: ${{ needs.version.outputs.version }}
      CI_LAUF: ${{ needs.ci-stand.outputs.lauf }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # So, wie Home Assistant es abruft: ANONYM. Ein Image, das nur mit
      # Anmeldung abrufbar ist, besteht jeden Workflow und scheitert beim
      # Nutzer.
      - name: Manifest ansehen (anonym, alle Architekturen)
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY,,}"
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          ANTWORT=$(mktemp)
          CODE=$(curl -s -o "$ANTWORT" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${V}")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::ghcr.io/${REPO}:${V} ist anonym nicht abrufbar (HTTP $CODE)."
            exit 1
          fi
          PLATTFORMEN=$(jq -r '.manifests[] | select(.platform.os == "linux")
            | .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)' "$ANTWORT" | sort)
          echo "$PLATTFORMEN"
          for P in amd64 arm64 arm/v7; do
            if ! printf '%s\n' "$PLATTFORMEN" | grep -qxF "$P"; then
              echo "::error::Im Manifest fehlt die Architektur $P."
              exit 1
            fi
          done

      # Nur vorspulen, nie ueberschreiben: liegt auf main etwas, das im
      # Release-Commit fehlt, bricht der Lauf ab, statt es zu verlieren.
      - name: config.yaml hochzaehlen und nach main schieben
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main enthaelt Commits, die im Release-Commit fehlen. Erst main in den Branch holen, dann neu starten."
            exit 1
          fi
          sed -i -E "s/^version:.*/version: \"${V}\"/" grow-os/config.yaml
          grep -qxF "version: \"${V}\"" grow-os/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${CI_LAUF}" ]; then
            CI_TEXT="CI gruen in Lauf ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CI_LAUF} (derselbe Commit)"
          else
            CI_TEXT="CI gruen in diesem Release-Lauf"
          fi
          git commit -am "Release ${V}" \
            -m "${CI_TEXT}; Image und Veroeffentlichung in Lauf ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin HEAD:main

      # Beim Tag-Weg gibt es den Tag schon. Beim Branch-Weg entsteht er hier —
      # auf dem Release-Commit mit der hochgezaehlten config.yaml, wie bei den
      # Releases bis forkai.152. Ein Push mit dem GITHUB_TOKEN startet keinen
      # weiteren Workflow; dieser Tag loest also nicht noch einmal release.yml
      # aus.
      - name: Tag anlegen und Release-Branch loeschen
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          git tag -a "v${V}" -m "${V}"
          git push origin "refs/tags/v${V}"
          git push origin --delete "${GITHUB_REF_NAME}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erst jetzt: `latest` zeigt nie auf ein Image, dessen CI nicht gruen war.
      - name: latest setzen
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "${REPO}:latest" "${REPO}:${V}"

      # Eintrag auf der GitHub-Releases-Seite: Text ist der Abschnitt aus
      # CHANGELOG.md (liegt schon im Release-Commit). Seit 20.07.2026 gab es
      # hier keinen solchen Schritt mehr, deshalb fehlten die Eintraege ab
      # forkai.153. Spaet und tolerant: Das Image ist schon veroeffentlicht,
      # ein fehlender Eintrag darf den Lauf nicht mehr rot machen.
      - name: GitHub-Release-Eintrag anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "Eintrag v${V} existiert schon."
            exit 0
          fi
          awk -v h="## ${V}" '($0 == h || index($0, h " ") == 1) { f = 1; next } /^## / { f = 0 } f' grow-os/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::Kein Changelog-Abschnitt fuer ${V} — Eintrag ohne Text."
            echo "Fork AI ${V}" > release-notes.md
          fi
          gh release create "v${V}" --verify-tag --title "${V}" --notes-file release-notes.md --latest \
            || echo "::warning::GitHub-Release-Eintrag fuer v${V} konnte nicht angelegt werden."
