name: CI

# Vier Jobs GLEICHZEITIG statt eines Jobs nacheinander. Bis forkai.152 lief
# alles in einem Job hintereinander: 18,5 Minuten, davon ~14 in den beiden
# E2E-Durchgaengen. Die Pruefungen sind dieselben geblieben — nur die
# Reihenfolge ist weg, und die E2E-Mappen sind auf mehrere Rechner verteilt.
#
# release.yml ruft genau diese Datei auf (workflow_call). Es gibt also nur
# EINE Beschreibung des Tors; ein Release kann nicht an einer anderen,
# schwaecheren Pruefung vorbeikommen.
on:
  push:
    # Nur Branches, und keine Release-Branches: Tag und release/* starten
    # release.yml, und das ruft diese Pruefung selbst auf — sonst liefe sie
    # doppelt. (Nur branches-ignore gesetzt heisst: Tags starten nichts.)
    branches-ignore: ['release/**']
  pull_request:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Jeder Job hat eine Zeitgrenze. Ohne sie wartet GitHub bis zu SECHS STUNDEN.
# Die Grenzen liegen beim Drei- bis Vierfachen der gemessenen Dauer.
#
# Der Browser-Install hat BEWUSST keine eigene, knappere Grenze: am 30.09.2026
# lieferte der Azure-Ubuntu-Spiegel die 27 MB Systempakete von `--with-deps`
# (vor allem Schriften) mit 97 kB/s — 4:35 statt ~15 s. Eine 5-Minuten-Grenze
# hat daraus einen ROTEN Lauf gemacht (Lauf 433), obwohl nichts kaputt war.
# Langsam ist besser als rot; gegen echtes Haengen reicht die Job-Grenze.
# Die Pakete weglassen geht nicht: die Pixelpruefungen messen mit genau diesen
# Schriften (CLAUDE.md, „Mein Rechner ist nicht die Anlage").
jobs:
  # Die Backend-Tests auf DREI Rechner verteilt. Innerhalb eines Teils laufen sie
  # weiter nacheinander — die Parallelisierung ist in
  # GrowDiary.Web.Tests/AssemblyInfo.cs bewusst abgeschaltet und bleibt es.
  #
  # Anlass (30.09.2026): 2265 Tests, zusammen 256 s, und genau so lange dauerte
  # der Lauf — kein einzelner Bremser (der langsamste: 3,9 s), sondern die
  # Summe. Auf einem langsamen GitHub-Rechner wurden daraus 8:22 Minuten.
  #
  # VOLLSTAENDIG durch Bauart: Teil „rest" ist genau das Gegenstueck zu
  # „services" und „api" — ein Test, der in keinen der ersten beiden passt,
  # landet dort, auch jeder neue Bereich und das MCP-Testprojekt. Jeder Teil hat
  # eine Mindestzahl (Mengenwaechter): ein Filter, der sich vertippt, faellt auf,
  # statt still fast nichts zu pruefen. Die Mindestzahlen liegen unter dem Stand
  # vom 30.09.2026 (Methoden: Services 964, Api 365, Rest ~500).
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: services
            filter: FullyQualifiedName~GrowDiary.Web.Tests.Services.
            mindestens: 900
          - teil: api
            filter: FullyQualifiedName~GrowDiary.Web.Tests.Api.
            mindestens: 350
          - teil: rest
            filter: FullyQualifiedName!~GrowDiary.Web.Tests.Services.&FullyQualifiedName!~GrowDiary.Web.Tests.Api.
            mindestens: 450
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore GrowDiary.slnx

      # Die ganze Mappe statt einzelner Projekte: das MCP-Add-on haengt mit an
      # der gemeinsamen Bibliothek, und ein Bruch dort soll hier auffallen und
      # nicht erst beim Image-Bau.
      - name: Build backend
        run: dotnet build GrowDiary.slnx --configuration Release --no-restore

      # Die MAPPE, nicht die einzelnen Projekte. Vorher standen hier zwei
      # Zeilen mit je einem Pfad — ein drittes Testprojekt haette niemand
      # bemerkt. Dieselbe Fehlerklasse wie das Menue, dem eine Seite fehlte.
      #
      # Mit TRX-Dateien: die Laufzeit JEDES Tests. Am 30.09.2026 brauchte derselbe
      # Commit einmal 2:52 und einmal 8:22 Minuten — alle Tests grün, aber welcher
      # bremste, stand nirgends. Die langsamsten stehen jetzt im Protokoll und in
      # der Zusammenfassung des Laufs, alle als Datei am Lauf.
      - name: Test backend (${{ matrix.teil }})
        run: >-
          dotnet test GrowDiary.slnx --configuration Release --no-build --verbosity minimal
          --filter "${{ matrix.filter }}"
          --logger trx --results-directory "${{ runner.temp }}/testergebnisse"

      - name: Langsamste Backend-Tests (${{ matrix.teil }})
        if: ${{ !cancelled() }}
        run: python3 scripts/langsamste-tests.py "${{ runner.temp }}/testergebnisse" 15 ${{ matrix.mindestens }}

      - name: Testergebnisse aufheben
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-testergebnisse-${{ matrix.teil }}
          path: ${{ runner.temp }}/testergebnisse/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GrowDiary.React/package-lock.json

      - name: Install frontend
        working-directory: GrowDiary.React
        run: npm ci

      - name: Lint frontend
        working-directory: GrowDiary.React
        run: npm run lint

      # Die Vitest-Sammlung lief bis beta.50 in KEINEM Durchlauf mit: das
      # Skript gab es, der Schritt fehlte. Aufgefallen ist es, als ein neuer
      # Test die Menue-Luecke haette halten sollen und niemand ihn ausgefuehrt
      # haette.
      - name: Test frontend
        working-directory: GrowDiary.React
        run: npm test

      - name: Build frontend
        working-directory: GrowDiary.React
        run: npm run build

  # Ohne Backend: jede Seite zeigt ihren Lade- oder Leerzustand. Das ist
  # ein echter Rauchtest — keine Route darf beim Rendern abstuerzen —,
  # aber mehr auch nicht.
  #
  # Auf zwei Rechner verteilt (--shard). Mit `fullyParallel` teilt Playwright
  # nach TESTS, nicht nach Dateien — eine Datei kann in beiden Teilen
  # vorkommen, jeder Test laeuft aber genau einmal. `serial`-Gruppen bleiben
  # zusammen. Nachgezaehlt mit `--list`: 803 Tests, Teile 402 + 401, streng
  # 268 + 268 + 267, ohne Doppelte.
  e2e-rauch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GrowDiary.React/package-lock.json

      - name: Install frontend
        working-directory: GrowDiary.React
        run: npm ci

      # Die Systempakete des Browsers (27 MB, vor allem Schriften) aus dem
      # Zwischenspeicher statt vom Ubuntu-Spiegel. Am 30.09.2026 lieferte der
      # Azure-Spiegel sie in drei von vier Laeufen mit ~100 kB/s — bis zu 9
      # Minuten fuer einen einzigen Job, auf den dann der ganze Release wartete.
      # Es bleiben DIESELBEN Pakete (die Pixelpruefungen messen mit genau diesen
      # Schriften): apt nimmt eine Datei aus dem Speicher nur, wenn Name und
      # Pruefsumme zum Paketindex passen, sonst laedt es wie bisher. Der
      # Schluessel haengt am Runner-Image — mit jedem neuen Image ein frischer
      # Satz.
      - name: Runner-Image merken
        run: echo "RUNNER_IMAGE=${ImageVersion:-unbekannt}" >> "$GITHUB_ENV"

      - name: Browser-Systempakete aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/pw-apt-debs
          key: pw-apt-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('GrowDiary.React/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: GrowDiary.React
        run: |
          if compgen -G "$HOME/pw-apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/pw-apt-debs/*.deb /var/cache/apt/archives/
            echo "$(ls "$HOME"/pw-apt-debs/*.deb | wc -l) Pakete aus dem Zwischenspeicher bereitgelegt."
          fi
          npx playwright install --with-deps chromium
          mkdir -p "$HOME/pw-apt-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/pw-apt-debs/" 2>/dev/null || true
          echo "$(ls "$HOME"/pw-apt-debs/*.deb 2>/dev/null | wc -l) Pakete fuer den naechsten Lauf gemerkt."

      - name: E2E ohne Backend (Rauchtest, Teil ${{ matrix.teil }}/2)
        working-directory: GrowDiary.React
        run: npx playwright test --shard=${{ matrix.teil }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rauch-${{ matrix.teil }}
          path: GrowDiary.React/playwright-report/
          retention-days: 7

  # Und dieselbe Mappe noch einmal GEGEN DIE LAUFENDE APP mit vollem
  # Demobestand. Erst hier pruefen die Faelle wirklich etwas:
  # von 34 Faellen aus vier Dateien uebersprangen sich im Lauf ohne
  # Backend 31 und drei liefen. E2E_STRENG=1 macht jeden Uebersprung
  # zum Fehler, damit das nicht wieder still passiert.
  #
  # Auf drei Rechner verteilt; JEDER Teil startet seine eigene App mit
  # eigenem, frischem Demobestand. Die Teile teilen sich also keine
  # Datenbank und koennen sich nicht gegenseitig Daten veraendern.
  e2e-streng:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GrowDiary.React/package-lock.json

      - name: Build backend
        run: dotnet build GrowDiary.Web/GrowDiary.Web.csproj --configuration Release

      - name: Install frontend
        working-directory: GrowDiary.React
        run: npm ci

      # Schreibt nach GrowDiary.Web/wwwroot — daraus liefert die App gleich
      # die Oberflaeche aus.
      - name: Build frontend
        working-directory: GrowDiary.React
        run: npm run build

      # Die Systempakete des Browsers (27 MB, vor allem Schriften) aus dem
      # Zwischenspeicher statt vom Ubuntu-Spiegel. Am 30.09.2026 lieferte der
      # Azure-Spiegel sie in drei von vier Laeufen mit ~100 kB/s — bis zu 9
      # Minuten fuer einen einzigen Job, auf den dann der ganze Release wartete.
      # Es bleiben DIESELBEN Pakete (die Pixelpruefungen messen mit genau diesen
      # Schriften): apt nimmt eine Datei aus dem Speicher nur, wenn Name und
      # Pruefsumme zum Paketindex passen, sonst laedt es wie bisher. Der
      # Schluessel haengt am Runner-Image — mit jedem neuen Image ein frischer
      # Satz.
      - name: Runner-Image merken
        run: echo "RUNNER_IMAGE=${ImageVersion:-unbekannt}" >> "$GITHUB_ENV"

      - name: Browser-Systempakete aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/pw-apt-debs
          key: pw-apt-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('GrowDiary.React/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: GrowDiary.React
        run: |
          if compgen -G "$HOME/pw-apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/pw-apt-debs/*.deb /var/cache/apt/archives/
            echo "$(ls "$HOME"/pw-apt-debs/*.deb | wc -l) Pakete aus dem Zwischenspeicher bereitgelegt."
          fi
          npx playwright install --with-deps chromium
          mkdir -p "$HOME/pw-apt-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/pw-apt-debs/" 2>/dev/null || true
          echo "$(ls "$HOME"/pw-apt-debs/*.deb 2>/dev/null | wc -l) Pakete fuer den naechsten Lauf gemerkt."

      # Die Datenbank liegt in einem frischen Temp-Verzeichnis: der
      # Demobestand saet nur in eine Datenbank ganz ohne Grows, und die
      # Tests schreiben.
      - name: App mit Demobestand starten
        run: |
          mkdir -p "${RUNNER_TEMP}/growos-daten"
          GROW_OS_DEMO=1 \
          GROWDIARY_DATA_PATH="${RUNNER_TEMP}/growos-daten" \
          GROWDIARY_DB_PATH="${RUNNER_TEMP}/growos-daten/grow-diary.db" \
          dotnet run --project GrowDiary.Web --configuration Release --no-build \
            > "${RUNNER_TEMP}/growos.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5076/api/grows > /dev/null; then
              echo "App antwortet nach ${i} s."
              # OHNE `|| true`: das ist der einzige Beleg, dass der Demobestand
              # wirklich gesaet wurde. Mit dem `|| true` konnte dieser Schritt
              # nicht fehlschlagen — der strenge E2E-Lauf haette im Zweifel
              # gegen eine LEERE Datenbank gemessen und gruen gemeldet.
              if ! grep -i 'Testdaten: Demobestand' "${RUNNER_TEMP}/growos.log"; then
                echo "::error::Der Demobestand wurde nicht gesaet. Die E2E-Faelle wuerden"
                echo "::error::gegen eine leere Datenbank laufen und nichts pruefen."
                tail -40 "${RUNNER_TEMP}/growos.log"
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          echo '::error::Die App ist nach 60 s nicht erreichbar.'
          cat "${RUNNER_TEMP}/growos.log"
          exit 1

      - name: E2E gegen die laufende App (streng, Teil ${{ matrix.teil }}/3)
        working-directory: GrowDiary.React
        env:
          GROW_OS_URL: http://localhost:5076
          E2E_STRENG: '1'
        run: npx playwright test --shard=${{ matrix.teil }}/3

      - name: Protokoll der App bei Fehlschlag
        if: ${{ failure() }}
        run: tail -n 200 "${RUNNER_TEMP}/growos.log" || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-streng-${{ matrix.teil }}
          path: GrowDiary.React/playwright-report/
          retention-days: 7
