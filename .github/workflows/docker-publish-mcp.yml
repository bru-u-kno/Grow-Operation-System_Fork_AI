name: Docker image (MCP)

# Eigener Ablauf, weil der MCP-Server seine eigene Versionsnummer hat: Cultivate Control
# soll sich nicht mitbewegen, nur weil hier etwas erscheint.
on:
  push:
    tags:
      - "mcp-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Tag to publish, e.g. 0.1.0. Leave empty to read grow-mcp/config.yaml.
          Pass it explicitly to build the image BEFORE bumping config.yaml — Home Assistant
          offers an update the moment that file lands on main, so bumping it first opens a
          window in which the store advertises a version whose image does not exist yet.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve add-on version
        id: addonver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -E '^version:' grow-mcp/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/')
            echo "Version aus config.yaml: $V"
          else
            echo "Version aus Eingabe: $V"
          fi
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Ungueltige Version '$V' — erwartet wird z. B. 0.1.0 oder 0.2.0-beta.1."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Der Bildname muss zu `image:` in grow-mcp/config.yaml passen.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-mcp
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.addonver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./grow-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
