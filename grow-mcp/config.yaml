name: Grow MCP Fork AI
version: "0.2.0-forkai.1"
slug: grow_mcp
description: Grow OS Fork AI als Werkzeugkasten fuer Claude und andere MCP-Klienten im eigenen Netz
url: https://github.com/bru-u-kno/Grow-Operation-System_Fork_AI
# Das Image des Forks — gebaut von .github/workflows/docker-publish-mcp.yml unter
# ghcr.io/<repository>-mcp. Bis 0.1.8 stand hier das Image des Originals: der
# Fork-MCP lief also nie mit Fork-Code (Befund 02.10.2026).
image: ghcr.io/bru-u-kno/grow-operation-system_fork_ai-mcp
arch:
  - aarch64
  - armv7
  - amd64
# Eigener dotnet-ENTRYPOINT, die s6-Schicht wird nicht gebraucht.
init: false
# Die Einrichtungsseite in der HA-Seitenleiste; HA besitzt hier die Anmeldung.
ingress: true
ingress_port: 5078
panel_icon: mdi:tools
panel_title: Grow MCP Fork AI
# Die EINZIGE Tuer ins Heimnetz. Dahinter liegt nur die MCP-Schnittstelle, und
# die verlangt den Schluessel, der auf der Ingress-Seite steht. Die Seite selbst
# ist ueber diesen Port bewusst NICHT erreichbar — sonst koennte sich jeder im
# Netz den Schluessel abholen.
# Port 5080, nicht 5079: der Grow MCP des Originals belegt 5079, und beide
# sollen nebeneinander laufen koennen. Muss zu Tueren.NetzPort passen
# (GrowMcp.Tests/ForkAusstattungTests.cs).
ports:
  5080/tcp: 5080
ports_description:
  5080/tcp: MCP-Schnittstelle fuer Claude Code und Claude Desktop (Schluessel noetig)
# Nur fuer eine einzige Frage: wie heisse ich selbst? Aus dem eigenen Namen folgt
# der von Grow OS. Bewusst KEIN `hassio_role: manager` — das erlaubte, jedes
# andere Add-on zu starten, zu stoppen und zu deinstallieren.
hassio_api: true
options:
  grow_os_adresse: ""
schema:
  # Nur noetig, wenn der Server Grow OS nicht von selbst findet.
  grow_os_adresse: str?
